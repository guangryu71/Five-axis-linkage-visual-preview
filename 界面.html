    <style>

       
        /* 顶部菜单栏样式 */
        .menu-bar {
            background: #333;
            position: relative;
            top: 0;
            padding: 5px; ;
            height: 60px;
            align-self: center;
        
        }
        .menu-item {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            cursor: pointer;
        }
        .menu-item:hover {
            background: #555;
        }
        .menu-item:hover .sub-menu {
            
            display: block;
        }
        .sub-menu {
            display: block;
            display: none;
            position: absolute;
            background: #444;
            min-width: 130px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 9999;
            width: 205px;

        }
        
        .sub-menu a {
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            z-index: 400;
            text-align: left;
        }
        .sub-menu a:hover {
            background: #b32a75;
            padding: 10px 15px;
            
            
        }

        .main-container{
            background-color: rgb(104, 102, 102);
            display: flex;
            gap: 20px;
        }

        /* 其他原有样式保留 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .toolbar {
            background: #a3a3a5;
            height: 80px;
            z-index: 1;
            width: 1255px;
            position: relative;
            bottom: 10px;
            list-style-type: none;
            display: flex;
            gap:10px;
        }
        .toolbar a{
            padding: 5px;
            border: 2px solid #fbf2f2;
            text-decoration: none;
        }
        .toolbar a:visited{
            color: #000000;
        }
        .toolbar a:hover{
            color: #333;
        }
        .toolbar a:active{
            color:#da1313;
        }

        .top-param-area {
            background: #5cb85c;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            z-index: 10;
        }
        .param-group {
            background-color: #308530;
            margin: 5px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input[type="number"] {
            width: 60px;
        }
        .left-panel {
            display: grid;
            gap: 3px;
            background: #818481;
            height: 400px;
            width: 35px;
            padding: 50px;
            position: relative;
            bottom: 10.5px;
            z-index: 10;
           
            
        }
    
        .center-area {
            height: 310px;
            width:300px;
            flex: 1;
            background: #c0c0b6;
            padding: 10px;
            position: relative;
            left: 600px;
            bottom: 870px;   
            
        }
        
        .blue-display {
            display: inline-block;
            background: #0839b6;
            width: 870px;
            height: 460px;
            margin: 15px 0;
            left: 114px;
            z-index: 9000;
            border: 10px solid #817e7e;
        }
    /* zuo */
        .right-panel{
            display: inline-block;
            width: 300px;
            background: #666;
            color: white;
            padding: 10px;
            height: 470px;
        }
        
        .bottom-panel{
            width: 1120px;
            height: 174px;
            background-color: #56567b;
            position: relative;
            bottom: 235px;
            left: 135px;
            position: relative;
            z-index: 500000;
        }
        .bottom-panel-1{
            position: relative;
        }
        
        .button{
            z-index: 900;
            width: 125px;
            margin: 150px auto 20px auto;
            position: relative;
            bottom: 1473px;
            left: 350px;
        }
       
        .form-group {
            width: auto;
            height: auto;
            z-index: 1;
            margin: 10px 0;
            position: static;
        }
        .point-table{
            z-index: 1;
            position: static;
            font-weight: bold;
            margin: 10px 0;
        }
        .face-table{
            z-index: 1;
            position: static;
            font-weight: bold;
            margin: 10px 0;
        }

        .print_progress:link{
            font-family: 宋体;
            font-weight: bold;
            color: #000000;
            text-decoration: none;
        }
        .print_progress:hover{
            color: #0839b6;
        }
        .inptArea{
            display: flex;
            flex-direction: column;
            padding: 15px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            margin: 10px 0;
            position: relative;
            z-index: 1;
            width: 200px;
            height: 460px;
        }
        
        /* inptArea内部元素的边框样式 */
        .inptArea .form-group {
            border: 1px solid #999;
            padding: 10px;
            border-radius: 4px;
            background: white;
        }
        
        .inptArea .point-table,
        .inptArea .face-table {
            border: 1px solid #999;
            padding: 8px;
            border-radius: 4px;
            background: white;
        }
        
        .inptArea .fule {
            border: 1px solid #999;
            padding: 10px;
            border-radius: 4px;
            background: white;
            text-align: center;
        }
    </style>
</head>
<body>
   
    <!-- 顶部菜单栏 -->
    <div class="menu-bar">
        <div class="menu-item">
            文件[F]
            <div class="sub-menu">

            <div class="sub-menu">
                <ol>
                    <li><a href="static\templates\模型曲面绘图.html" target="_blank">打印过程预览</a></li>
                    <li><a href="static\templates\1五轴联动数控机床.html" target="_blank">五轴联动可视化</a></li>

        <div class="menu-item">
            操作[O]
            <div class="sub-menu">
                    <button style="float: left; margin: 5px;">开始操作</button>
                    <button style="float:left; margin: 5px;">暂停操作</button>
            </div>

        <div class="menu-item">

            <div class="sub-menu" style="align-items: center;">

            <div class="sub-menu">

                    <li><a href="">查看更多</a></li>
                </ol>
            </div>

        <div class="menu-item">
            <a href="static\templates\ollama_chat.html" target="_blank" style="color: white;text-decoration: auto">AI接入</a>
        </div>
    </div>
    
    <div class="top-param-area">
        <!-- 原有参数组保留 -->
        <div class="param-group" style="border:1px solid #fafcfa;">
            <label>喷头高度(cm) :</label>
            <input type="number" id="nozzleHeight" min="0" max="100" value="0">
        </div>
        <div class="param-group" style="border:1px solid #fafcfa;">
            <label>垂直喷射速度(cm/s) :</label>
            <input type="number" id="verticalSpeed" min="0" max="100" value="0" style="position: relative; bottom: 17.5px;">
        </div>
        <div class="param-group" style="border:1px solid #fafcfa;">
            <label>喷射加减速距离(cm) :</label>
            <input type="number" id="injectionDeceleration" min="0" max="100" value="0" style="position: relative; bottom: 17.5px;">
        </div>
        <div class="param-group" style="border:1px solid #fafcfa;">
            <label>固化加减速距离(cm) :</label>
            <input type="number" id="curingDeceleration" min="0" max="100" value="0" style="position: relative; bottom: 17.5px;">
        </div>
        
    
        <div class="param-group" style="border:1px solid #fafcfa;">
            <label>步骤(step) :</label>
            <input type="number" id="step" min="0" max="100" value="0" style="position: relative; ">
        </div>
        <div class="param-group" style="border:1px solid #fafcfa;">
            <label>匀速运动速度(cm/s) :</label>
            <input type="number" id="uniformSpeed" min="0" max="100" value="0" style="position: relative; bottom: 17.5px;">
        </div>
        <div class="param-group" style="border:1px solid #fafcfa; position: relative; min-height: 40px;">
            <label>固化步骤(step) :</label>
            <details style="position: absolute; top: 5px; right: 10px; width: 200px;">
                <summary 
                style="position: absolute;
                        left: 90px;
                        top: 15px;
                        cursor: pointer;
                        color: #0839b6;
                        font-weight: bold;
                        display: inline-block;">
                        打印步骤
                </summary>
                <textarea 
                style="width: 228px;
                height: 280px;
                margin-top: 5px;
                position: absolute;
                top: 35px;
                left: 90px;
                z-index: 100;">
                步骤摘抄：
                </textarea>
            </details>
        </div>
    </div>

    
    <div class="main-container">

             <!-- 输入区域 -->
        <div class="inptArea">
            <div class="form-group">
                <label>输入点表数字：</label><br><br>
                <input type="number" id="pointInput" placeholder="输入点表数字" style="width: 100px;">
            </div>
            <br>
            <div class="form-group">
                <label>输入面表数字：</label><br><br>
                <input type="number" id="faceInput" placeholder="输入面表数字" style="width: 100px; " >
            </div>
            <!-- 显示区域 -->
            <div class="point-table">点表：<span id="point-count">0</span></div>
            <div class="face-table">面表：<span id="face-count">0</span></div>
            <div class="fule" style="margin-top: 20px;">
                <button onclick="updateDisplay()" style="padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">更新显示</button>
            </div>
        </div>

        <!-- 原有界面结构保留 -->

        <div class="blue-display">
            <div id="viewer">
                   <div id="loading"></div>
            </div>
        </div>
        
        <div class="right-panel">
            <table border="1" cellspacing="0" align="left" bordercolor="black">
            <tr height="50" align="center"><td width="100">开始时间<input disabled placeholder="0s" type="text" style="height: 30px;"></td></tr>
            <tr height="50" align="center"><td width="100">结束时间<input disabled placeholder="0s" type="text" style="height: 30px;"></td></tr>
            <tr height="50" align="center"><td width="100">用时/s<input disabled placeholder="0s" type="text" style="height: 30px;"></td></tr>
            <tr height="50" align="center"><td width="100">串口状态<input disabled placeholder="OFF" type="text" style="height: 30px;"></td></tr>
            <tr height="50" align="center"><td width="150">正在打印的行代码
                <textarea placeholder="null" disabled style="height: 30px;"></textarea>
            </td></tr>
            </table>
        </div>
    </div>


    <script>
        function updateDisplay() {
            // 获取输入值
            const pointNum = document.getElementById('pointInput').value || 0;
            const faceNum = document.getElementById('faceInput').value || 0;

            // 更新点表显示
            document.getElementById('point-count').textContent = pointNum;
            
            // 更新面表显示
            document.getElementById('face-count').textContent = faceNum;
        }
    

    </script>

   
</body>
</html>
