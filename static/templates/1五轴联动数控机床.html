<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/OBJLoader.js"></script>
    <script src="script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五轴联动数控机床模拟系统</title>
<head>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #container { display: flex; height: 100vh; }
        #control-panel { width: 300px; padding: 20px; background: #f0f0f0; overflow-y: auto; }
        #viewer { flex: 1;nodeIntegration: true }
        .section { margin-bottom: 20px; }
        h2 { margin-top: 0; }
        button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        textarea { width: 100%; height: 100px; }
        .axis-control { display: flex; margin-bottom: 10px; }
        .axis-control label { width: 50px; }
        .axis-control input { flex: 1; }
    </style>
</head>
<body>
    <div id="container">
        <div id="control-panel">
            <div class="section">
                <h2>模型输入</h2>
                <textarea id="gcode-input" placeholder="输入G代码或上传模型文件..."></textarea>
                <div style="margin-top: 10px;">
                    <button id="load-gcode">加载G代码</button>
                    <input type="file" id="model-upload" accept=".stl,.obj,.gcode" style="display: none;">
                    <button id="upload-btn">上传模型</button>
                </div>
            </div>
            
            <div class="section">
                <h2>机床控制</h2>
                <div class="axis-control">
                    <label>X轴:</label>
                    <input type="range" id="x-axis" min="-100" max="100" value="0" step="1">
                    <span id="x-value">0</span>
                </div>
                <div class="axis-control">
                    <label>Y轴:</label>
                    <input type="range" id="y-axis" min="-100" max="100" value="0" step="1">
                    <span id="y-value">0</span>
                </div>
                <div class="axis-control">
                    <label>Z轴:</label>
                    <input type="range" id="z-axis" min="0" max="100" value="50" step="1">
                    <span id="z-value">50</span>
                </div>
                <div class="axis-control">
                    <label>A轴:</label>
                    <input type="range" id="a-axis" min="-90" max="90" value="0" step="1">
                    <span id="a-value">0°</span>
                </div>
                <div class="axis-control">
                    <label>C轴:</label>
                    <input type="range" id="c-axis" min="-180" max="180" value="0" step="1">
                    <span id="c-value">0°</span>
                </div>
                <button id="reset-btn">复位</button>
                <button id="run-btn">运行</button>
            </div>
            
            <div class="section">
                <h2>状态信息</h2>
                <div id="status-info">
                    <p>机床状态: 待机</p >
                    <p>当前位置: X0 Y0 Z0 A0 C0</p >
                </div>
            </div>
            <!-- 在HTML的控制面板部分添加 -->
<div class="section">
    <h2>速度控制</h2>
    <div class="axis-control">
        <label>速度:</label>
        <input type="number" id="speed-factor" min="1" max="10" value="5" step="1">
        <span>以5为基准</span>
    </div>
</div>

<!-- 添加轨迹控制部分 -->
<div class="section">
    <h2>刀具轨迹控制</h2>
    <div style="margin-bottom: 10px;">
        <button id="toggle-trajectory">显示轨迹</button>
        <button id="clear-trajectory">清除轨迹</button>
    </div>
    <div style="margin-top: 10px;">
        <label>轨迹颜色:</label>
        <input type="color" id="trajectory-color" value="#ff0000">
    </div>
    <div style="margin-top: 10px;">
        <label>轨迹粗细:</label>
        <input type="range" id="trajectory-width" min="1" max="5" value="2" step="0.5">
        <span id="trajectory-width-value">2</span>
    </div>
    <div style="margin-top: 10px;">
        <input type="checkbox" id="record-trajectory" checked>
        <label for="record-trajectory">记录轨迹</label>
    </div>
</div>
        </div>
        
        <div id="viewer"></div>
    </div>
</body>
<script>

    // 初始化场景、相机和渲染器
let scene, camera, renderer, controls;
let machineGroup, tool, workpiece, axesHelper;
let machineComponents;
let currentPosition = { x: 0, y: 0, z: 50, a: 0, c: 0 };
let isRunning = false;
let speedFactor =5;

// 轨迹相关变量
let trajectoryPoints = [];
let trajectoryLine = null;
let showTrajectory = true;
let recordTrajectory = true;
let trajectoryColor = 0xff0000;
let trajectoryWidth = 2;

init();
<!-- 添加事件监听 -->
document.getElementById('speed-factor').addEventListener('change', (e) => {
    speedFactor = parseInt(e.target.value);
});
function init() {
    // 创建场景
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);
    
    // 创建相机
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(150, 150, 150);
    
    // 创建渲染器
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(document.getElementById('viewer').clientWidth, document.getElementById('viewer').clientHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('viewer').appendChild(renderer.domElement);
    
    // 添加轨道控制器(控制相机)
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    
    // 添加光源
    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 1, 1);
    directionalLight.castShadow = true;
    scene.add(directionalLight);
    
    // 添加坐标轴辅助
    axesHelper = new THREE.AxesHelper(50);
    scene.add(axesHelper);
    
    // 创建机床模型
    createMachine();
    
    // 添加事件监听器
    setupEventListeners();
    
    // 开始动画循环
    animate();
    
    // 窗口大小调整
    window.addEventListener('resize', onWindowResize);
}

function createMachine() {
    machineGroup = new THREE.Group();
    scene.add(machineGroup);
    
    // 机床顶部
    const geometry = new THREE.BoxGeometry(150, 20, 150);
    const material = new THREE.MeshBasicMaterial({ color: 0x555555 });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.y = 60;
    scene.add(cube);

    // 创建数控机床围墙
    const wallo = new THREE.BoxGeometry(130, 10, 150);
    const wall1 = new THREE.MeshBasicMaterial({ color: 0x555555, transparent:true, opacity:0.5});
    const wall = new THREE.Mesh(wallo, wall1);
    wall.position.y = 8;
    wall.position.x = 80;
    wall.rotation.z = Math.PI / 2;
    scene.add(wall);

    const walli = new THREE.BoxGeometry(150, 10, 130);
    const wall2 = new THREE.MeshBasicMaterial({ color: 0x555555, transparent:true, opacity:0.5});
    const walll = new THREE.Mesh(walli, wall2);
    walll.position.y = 8;
    walll.position.z = 80;
    walll.rotation.x = Math.PI / 2;
    scene.add(walll);
    
    // 机床底座
    const baseGeometry = new THREE.BoxGeometry(150, 10, 150);
    const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x336633 });
    const base = new THREE.Mesh(baseGeometry, baseMaterial);
    base.position.y = -60;
    machineGroup.add(base);
    
    // X轴导轨 (左右移动) - 固定部分
    const xRailGeometry = new THREE.BoxGeometry(120, 15, 20);
    const xRailMaterial = new THREE.MeshPhongMaterial({ color: 0x555555 });
    const xRail = new THREE.Mesh(xRailGeometry, xRailMaterial);
    xRail.position.y = 50;
    machineGroup.add(xRail);
    
    // X轴滑块 - 这是X轴移动的部分
    const xSlider = new THREE.Group();
    xSlider.position.x = currentPosition.x;
    machineGroup.add(xSlider);
    
    // X轴滑块可视化
    const xSliderGeometry = new THREE.BoxGeometry(30, 20, 30);
    const xSliderMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
    const xSliderVisual = new THREE.Mesh(xSliderGeometry, xSliderMaterial);
    xSliderVisual.position.y = 50;
    xSlider.add(xSliderVisual);
    
    // Y轴导轨 (前后移动) - 固定在X滑块上
    const yRailGeometry = new THREE.BoxGeometry(20, 15, 120);
    const yRailMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
    const yRail = new THREE.Mesh(yRailGeometry, yRailMaterial);
    yRail.position.y = 50;
    xSlider.add(yRail);
    
    // Y轴滑块 - 这是Y轴移动的部分
    const ySlider = new THREE.Group();
    ySlider.position.z = currentPosition.y;
    xSlider.add(ySlider);
    
    // Y轴滑块可视化
    const ySliderGeometry = new THREE.BoxGeometry(25, 20, 25);
    const ySliderMaterial = new THREE.MeshPhongMaterial({ color: 0x999999 });
    const ySliderVisual = new THREE.Mesh(ySliderGeometry, ySliderMaterial);
    ySliderVisual.position.y = 50;
    ySlider.add(ySliderVisual);
    
    // Z轴立柱 - 固定在Y滑块上
    const zAxisGeometry = new THREE.BoxGeometry(15, 70, 15);
    const zAxisMaterial = new THREE.MeshPhongMaterial({ color: 0x777777 });
    const zAxis = new THREE.Mesh(zAxisGeometry, zAxisMaterial);
    zAxis.position.y = 35; // 调整位置使底部在滑块上
    ySlider.add(zAxis);
    
    // Z轴滑块 - 这是Z轴移动的部分
    const zSlider = new THREE.Group();
    zSlider.position.y = currentPosition.z - 50; // 相对位置
    ySlider.add(zSlider);
    
    // Z轴滑块可视化
    const zSliderGeometry = new THREE.BoxGeometry(25, 15, 25);
    const zSliderMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
    const zSliderVisual = new THREE.Mesh(zSliderGeometry, zSliderMaterial);
    zSliderVisual.position.y = 70; // 在立柱顶部
    zSlider.add(zSliderVisual);
    
    // A轴旋转部件 (绕X轴旋转)
    const aAxis = new THREE.Group();
    aAxis.rotation.x = THREE.MathUtils.degToRad(currentPosition.a);
    zSlider.add(aAxis);
    
    // A轴部件可视化 - 比C轴更小
    const aAxisGeometry = new THREE.CylinderGeometry(6, 6, 15, 16);
    const aAxisMaterial = new THREE.MeshPhongMaterial({ color: 0xbbbbbb });
    const aAxisVisual = new THREE.Mesh(aAxisGeometry, aAxisMaterial);
    aAxisVisual.rotation.z = Math.PI / 2; // 水平放置
    aAxis.add(aAxisVisual);
    
    // C轴旋转部件 (绕Z轴旋转)
    const cAxis = new THREE.Group();
    cAxis.rotation.z = THREE.MathUtils.degToRad(currentPosition.c);
    aAxis.add(cAxis);
    
    // C轴部件可视化 - 比刀具小
    const cAxisGeometry = new THREE.CylinderGeometry(8, 8, 6, 16);
    const cAxisMaterial = new THREE.MeshPhongMaterial({ color: 0xcccccc });
    const cAxisVisual = new THREE.Mesh(cAxisGeometry, cAxisMaterial);
    cAxisVisual.rotation.x = Math.PI / 2; // 垂直放置
    cAxis.add(cAxisVisual);
    
    // 刀具 - 改为扁圆柱，底面与地面平行
    const toolGeometry = new THREE.CylinderGeometry(8, 8, 4, 16);
    const toolMaterial = new THREE.MeshPhongMaterial({ color: 0xff1163 });
    tool = new THREE.Mesh(toolGeometry, toolMaterial);
    tool.position.y = -10; // 从C轴中心向下延伸
    // 移除了 rotation.x，使圆柱底面与地面平行
    cAxis.add(tool);
    
    // 工件平台
    const workpieceGeometry = new THREE.BoxGeometry(60, 10, 60);
    const workpieceMaterial = new THREE.MeshPhongMaterial({ 
        color: 0xa66aaa, 
        transparent: true, 
        opacity: 0.8 
    });
    workpiece = new THREE.Mesh(workpieceGeometry, workpieceMaterial);
    workpiece.position.y = 10;
    base.add(workpiece);
    
    // 添加一个示例工件（立方体）
    const sampleWorkpieceGeometry = new THREE.BoxGeometry(30, 20, 30);
    const sampleWorkpieceMaterial = new THREE.MeshPhongMaterial({ 
        color: 0x6699ff,
        transparent: true,
        opacity: 0.7
    });
    const sampleWorkpiece = new THREE.Mesh(sampleWorkpieceGeometry, sampleWorkpieceMaterial);
    sampleWorkpiece.position.y = 15; // 在工作台上方
    workpiece.add(sampleWorkpiece);
    
    // 保存引用以便更新
    machineComponents = {
        xSlider,    // X轴移动组
        ySlider,    // Y轴移动组
        zSlider,    // Z轴移动组
        aAxis,      // A轴旋转组
        cAxis,      // C轴旋转组
        tool        // 刀具
    };
}

function setupEventListeners() {
    // 轴控制滑块
    document.getElementById('x-axis').addEventListener('input', (e) => {
        currentPosition.x = parseFloat(e.target.value);
        document.getElementById('x-value').textContent = currentPosition.x;
        updateMachinePosition();
    });
    
    document.getElementById('y-axis').addEventListener('input', (e) => {
        currentPosition.y = parseFloat(e.target.value);
        document.getElementById('y-value').textContent = currentPosition.y;
        updateMachinePosition();
    });
    
    document.getElementById('z-axis').addEventListener('input', (e) => {
        currentPosition.z = parseFloat(e.target.value);
        document.getElementById('z-value').textContent = currentPosition.z;
        updateMachinePosition();
    });
    
    document.getElementById('a-axis').addEventListener('input', (e) => {
        currentPosition.a = parseFloat(e.target.value);
        document.getElementById('a-value').textContent = currentPosition.a + '°';
        updateMachinePosition();
    });
    
    document.getElementById('c-axis').addEventListener('input', (e) => {
        currentPosition.c = parseFloat(e.target.value);
        document.getElementById('c-value').textContent = currentPosition.c + '°';
        updateMachinePosition();
    });
    
    // 复位按钮
    document.getElementById('reset-btn').addEventListener('click', () => {
        resetMachine();
    });
    
    // 运行按钮
    document.getElementById('run-btn').addEventListener('click', () => {
        runGCode();
    });
    
    // 加载G代码按钮
    document.getElementById('load-gcode').addEventListener('click', () => {
        const gcode = document.getElementById('gcode-input').value;
        if (gcode) {
            parseGCode(gcode);
        }
    });
    
    // 上传模型按钮
    document.getElementById('upload-btn').addEventListener('click', () => {
        document.getElementById('model-upload').click();
    });
    
    document.getElementById('model-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            loadModelFile(file);
        }
    });
    
    // 轨迹控制事件监听
    document.getElementById('toggle-trajectory').addEventListener('click', () => {
        showTrajectory = !showTrajectory;
        document.getElementById('toggle-trajectory').textContent = showTrajectory ? '隐藏轨迹' : '显示轨迹';
        if (trajectoryLine) {
            trajectoryLine.visible = showTrajectory;
        }
    });
    
    document.getElementById('clear-trajectory').addEventListener('click', () => {
        clearTrajectory();
    });
    
    document.getElementById('trajectory-color').addEventListener('change', (e) => {
        trajectoryColor = parseInt(e.target.value.replace('#', '0x'));
        updateTrajectoryAppearance();
    });
    
    document.getElementById('trajectory-width').addEventListener('input', (e) => {
        trajectoryWidth = parseFloat(e.target.value);
        document.getElementById('trajectory-width-value').textContent = trajectoryWidth;
        updateTrajectoryAppearance();
    });
    
    document.getElementById('record-trajectory').addEventListener('change', (e) => {
        recordTrajectory = e.target.checked;
    });
}

function updateMachinePosition() {
    if (!machineComponents) return;
    
    // 更新X轴位置
    machineComponents.xSlider.position.x = currentPosition.x;
    
    // 更新Y轴位置（注意：这里用position.z是因为导轨方向）
    machineComponents.ySlider.position.z = currentPosition.y;
    
    // 更新Z轴位置（相对位置）
    machineComponents.zSlider.position.y = currentPosition.z - 50;
    
    // 更新A轴旋转（绕X轴）
    machineComponents.aAxis.rotation.x = THREE.MathUtils.degToRad(currentPosition.a);
    
    // 更新C轴旋转（绕Z轴）
    machineComponents.cAxis.rotation.z = THREE.MathUtils.degToRad(currentPosition.c);
    
    // 记录刀具轨迹点
    if (recordTrajectory) {
        addTrajectoryPoint();
    }
    
    // 更新状态信息
    document.getElementById('status-info').innerHTML = `
        <p>机床状态: ${isRunning ? '运行中' : '待机'}</p>
        <p>当前位置: X${currentPosition.x.toFixed(2)} Y${currentPosition.y.toFixed(2)} Z${currentPosition.z.toFixed(2)} A${currentPosition.a.toFixed(2)}° C${currentPosition.c.toFixed(2)}°</p>
    `;
}

// 添加轨迹点
function addTrajectoryPoint() {
    // 获取刀具在世界坐标系中的实际位置
    const toolWorldPosition = new THREE.Vector3();
    tool.getWorldPosition(toolWorldPosition);
    
    // 添加新的轨迹点
    trajectoryPoints.push(toolWorldPosition.clone());
    
    // 更新轨迹线
    updateTrajectoryLine();
}

// 更新轨迹线
function updateTrajectoryLine() {
    // 如果已存在轨迹线，先移除
    if (trajectoryLine) {
        scene.remove(trajectoryLine);
        trajectoryLine.geometry.dispose();
        trajectoryLine.material.dispose();
    }
    
    // 如果轨迹点少于2个，不创建线条
    if (trajectoryPoints.length < 2) return;
    
    // 创建几何体
    const geometry = new THREE.BufferGeometry().setFromPoints(trajectoryPoints);
    
    // 创建材质
    const material = new THREE.LineBasicMaterial({ 
        color: trajectoryColor, 
        linewidth: trajectoryWidth 
    });
    
    // 创建线条
    trajectoryLine = new THREE.Line(geometry, material);
    trajectoryLine.visible = showTrajectory;
    
    // 添加到场景
    scene.add(trajectoryLine);
}

// 更新轨迹外观
function updateTrajectoryAppearance() {
    if (trajectoryLine) {
        trajectoryLine.material.color.setHex(trajectoryColor);
        trajectoryLine.material.linewidth = trajectoryWidth;
    }
}

// 清除轨迹
function clearTrajectory() {
    // 移除轨迹线
    if (trajectoryLine) {
        scene.remove(trajectoryLine);
        trajectoryLine.geometry.dispose();
        trajectoryLine.material.dispose();
        trajectoryLine = null;
    }
    
    // 清空轨迹点
    trajectoryPoints = [];
}

function resetMachine() {
    currentPosition = { x: 0, y: 0, z: 50, a: 0, c: 0 };
    
    // 清除轨迹
    clearTrajectory();
    
    // 更新滑块值
    document.getElementById('x-axis').value = currentPosition.x;
    document.getElementById('y-axis').value = currentPosition.y;
    document.getElementById('z-axis').value = currentPosition.z;
    document.getElementById('a-axis').value = currentPosition.a;
    document.getElementById('c-axis').value = currentPosition.c;
    
    // 更新显示值
    document.getElementById('x-value').textContent = currentPosition.x;
    document.getElementById('y-value').textContent = currentPosition.y;
    document.getElementById('z-value').textContent = currentPosition.z;
    document.getElementById('a-value').textContent = currentPosition.a + '°';
    document.getElementById('c-value').textContent = currentPosition.c + '°';
    
    // 初始化轨迹控制按钮文本
    document.getElementById('toggle-trajectory').textContent = showTrajectory ? '隐藏轨迹' : '显示轨迹';
    
    updateMachinePosition();
}

// 简化版的G代码解析器
function parseGCode(gcode) {
    const lines = gcode.split('\n');
    const commands = [];
    
    for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith(';')) continue;
        
        const parts = trimmed.split(/\s+/);
        const command = {
            type: parts[0].toUpperCase(),
            params: {}
        };
        
        for (let i = 1; i < parts.length; i++) {
            const param = parts[i].toUpperCase();
            const key = param[0];
            const value = parseFloat(param.substring(1));
            command.params[key] = value;
        }
        
        commands.push(command);
    }
    
    executeGCodeCommands(commands);
}

function executeGCodeCommands(commands) {
    isRunning = true;
    updateMachinePosition();
    
    let i = 0;
    const total = commands.length;
    const delay = 100 / speedFactor; // 每个命令之间的延迟(毫秒)
    const animationDuration = 500 / speedFactor; // 动画持续时间
    
    let startPosition = {...currentPosition};
    let targetPosition = {...currentPosition};
    
    function processNextCommand() {
        if (i >= total) {
            isRunning = false;
            updateMachinePosition();
            return;
        }
        
        const cmd = commands[i];
        i++;
        
        // 保存当前位置作为动画起点
        startPosition = {...currentPosition};
        targetPosition = {...currentPosition};
        
        switch (cmd.type) {
            case 'G0': // 快速移动
            case 'G1': // 线性插补
                if ('X' in cmd.params) targetPosition.x = cmd.params.X;
                if ('Y' in cmd.params) targetPosition.y = cmd.params.Y;
                if ('Z' in cmd.params) targetPosition.z = cmd.params.Z;
                if ('A' in cmd.params) targetPosition.a = cmd.params.A;
                if ('C' in cmd.params) targetPosition.c = cmd.params.C;
                break;
                
            case 'G28': // 回零
                targetPosition = { x: 0, y: 0, z: 50, a: 0, c: 0 };
                break;
        }
        
        // 开始动画
        animateToPosition(startPosition, targetPosition, animationDuration, () => {
            // 动画完成后处理下一个命令
            setTimeout(processNextCommand, delay);
        });
    }
    
    processNextCommand();
}

function animateToPosition(startPos, targetPos, duration, onComplete) {
    const startTime = Date.now();
    const endTime = startTime + duration;
    
    function updateAnimation() {
        const now = Date.now();
        const progress = Math.min(1, (now - startTime) / duration);
        
        // 线性插值
        currentPosition.x = startPos.x + (targetPos.x - startPos.x) * progress;
        currentPosition.y = startPos.y + (targetPos.y - startPos.y) * progress;
        currentPosition.z = startPos.z + (targetPos.z - startPos.z) * progress;
        currentPosition.a = startPos.a + (targetPos.a - startPos.a) * progress;
        currentPosition.c = startPos.c + (targetPos.c - startPos.c) * progress;
        
        updateMachinePosition();
        
        // 更新滑块显示
        document.getElementById('x-axis').value = currentPosition.x;
        document.getElementById('y-axis').value = currentPosition.y;
        document.getElementById('z-axis').value = currentPosition.z;
        document.getElementById('a-axis').value = currentPosition.a;
        document.getElementById('c-axis').value = currentPosition.c;
        
        document.getElementById('x-value').textContent = currentPosition.x.toFixed(2);
        document.getElementById('y-value').textContent = currentPosition.y.toFixed(2);
        document.getElementById('z-value').textContent = currentPosition.z.toFixed(2);
        document.getElementById('a-value').textContent = currentPosition.a.toFixed(2) + '°';
        document.getElementById('c-value').textContent = currentPosition.c.toFixed(2) + '°';
        
        if (now < endTime) {
            requestAnimationFrame(updateAnimation);
        } else {
            // 确保最终位置准确
            currentPosition = {...targetPos};
            updateMachinePosition();
            if (onComplete) onComplete();
        }
    }
    
    updateAnimation();
}

// 添加缓动函数
function easeInOutQuad(t) {
    return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

function runGCode() {
    const gcode = document.getElementById('gcode-input').value;
    if (gcode) {
        parseGCode(gcode);
    }
}

function loadModelFile(file) {
    const reader = new FileReader();
    const fileName = file.name.toLowerCase();
    
    reader.onload = function(event) {
        if (fileName.endsWith('.stl')) {
            const loader = new THREE.STLLoader();
            const geometry = loader.parse(event.target.result);
            const material = new THREE.MeshPhongMaterial({ color: 0x6699ff, specular: 0x111111, shininess: 200 });
            const mesh = new THREE.Mesh(geometry, material);
            
            // 清除旧模型
            if (workpiece.children.length > 0) {
                workpiece.children.forEach(child => workpiece.remove(child));
            }
            
            // 调整模型大小和位置
            mesh.position.y = 5;
            mesh.rotation.x = -Math.PI / 2;
            workpiece.add(mesh);
            
        } else if (fileName.endsWith('.obj')) {
            const loader = new THREE.OBJLoader();
            const object = loader.parse(event.target.result);
            
            if (workpiece.children.length > 0) {
                workpiece.children.forEach(child => workpiece.remove(child));
            }
            
            object.position.y = 5;
            object.rotation.x = -Math.PI / 2;
            workpiece.add(object);
            
        } else if (fileName.endsWith('.gcode')) {
            document.getElementById('gcode-input').value = event.target.result;
        }
    };
    
    if (fileName.endsWith('.gcode')) {
        reader.readAsText(file);
    } else {
        reader.readAsArrayBuffer(file);
    }
}

function onWindowResize() {
    const viewer = document.getElementById('viewer');
    camera.aspect = viewer.clientWidth / viewer.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
</script>
